{% extends "base.html" %}
{% block content %}

<div class="dashboard-header">
  <h1>Chain of Custody</h1>
  <a href="{{ url_for('dashboard') }}" class="primary-btn">Back</a>
</div>

<div class="card chain-card">

  <div class="chain-header">
    <p><strong>Evidence ID:</strong> {{ evidence_id }}</p>
  </div>

  <table class="chain-table">
    <thead>
      <tr>
        <th>Action</th>
        <th>Performed By</th>
        <th>Role</th>
        <th>Date & Time</th>
      </tr>
    </thead>

    <tbody>
      {% for row in history %}
      <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

</div>

{% endblock %}
