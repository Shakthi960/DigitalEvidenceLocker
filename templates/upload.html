{% extends "base.html" %}
{% block content %}

<div class="dashboard-header">
  <h1>Upload Evidence</h1>
  <a href="{{ url_for('dashboard') }}" class="primary-btn">Back</a>
</div>

<div class="card upload-card">

  <form method="POST" enctype="multipart/form-data" class="upload-form">

    <label>Case ID</label>
    <input type="text" name="case_id" placeholder="Enter Case ID" required>

    <label>Evidence ID (Unique)</label>
    <input type="text" name="evidence_id" placeholder="Enter Unique Evidence ID" required>

    <label>Select Evidence File</label>
    <input type="file" name="file" required>

    <button type="submit">Submit Evidence</button>

  </form>

</div>

{% endblock %}
