<h2>Evidence List</h2>

<table border="1">
<tr>
  <th>Evidence ID</th>
  <th>Case ID</th>
  <th>File</th>
  <th>Hash</th>
  <th>Actions</th>
</tr>

{% for row in evidence %}
<tr>
  <td>{{row[1]}}</td>
  <td>{{row[2]}}</td>
  <td>{{row[3]}}</td>
  <td>{{row[5]}}</td>
  <td>
    <a href="/download/{{row[1]}}">Download</a> |
    <a href="/chain/{{row[1]}}">Chain</a>
  </td>
</tr>
{% endfor %}
</table>
