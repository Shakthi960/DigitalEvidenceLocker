{% extends "base.html" %}
{% block content %}

<div class="dashboard-header">
  <h1>Evidence History</h1>
</div>

<div class="table-card">

<table>
<thead>
<tr>
<th>Evidence ID</th>
<th>Case ID</th>
<th>Status</th>
<th>Chain of Custody</th>
<th>Delete</th>
</tr>
</thead>

<tbody>

{% for row in evidence %}
<tr>

<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>

<td>
<span class="status {{ row[7]|lower|replace(' ','-') }}">
{{ row[7] }}
</span>
</td>

<td>
<a href="{{ url_for('chain', evidence_id=row[1]) }}" class="small-btn">
View Chain
</a>
</td>

{% if role == "Court" %}
<td>

<form method="POST" action="{{ url_for('delete_evidence', evidence_id=row[1]) }}">

<input type="password" name="delete_password" placeholder="Delete Password" required>

<button class="small-btn">Delete</button>

</form>

</td>
{% else %}
<td>-</td>
{% endif %}

</tr>
{% endfor %}

</tbody>
</table>

</div>

{% endblock %}
